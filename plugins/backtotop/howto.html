<h3>Bouton « Retour en haut »</h3>
<p>Un bouton rond apparaît en bas à droite après 400 px de défilement ; il ramène en haut de la page (sans dépendance, accessible au clavier).</p>
<p>Couleurs personnalisables (CMS config &gt; CSS, ou CSS du thème) :</p>
